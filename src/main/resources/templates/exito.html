<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra Exitosa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="alert alert-success text-center shadow-sm" role="alert">
        <h3 class="alert-heading mb-3">¡Pago Procesado con Éxito!</h3>
        <p>Tu compra ha sido confirmada y tus entradas están aseguradas.</p>
        <hr>
        <p class="mb-0">Hemos enviado las instrucciones de acceso a tu correo.</p>
      </div>
      <div class="card shadow-sm mt-4">
        <div class="card-header bg-white text-center">
          <h5 class="mb-0 text-muted">Resumen de tu Orden</h5>
        </div>
        <div class="card-body">
          <table class="table table-borderless mb-0">
            <tbody>
            <tr>
              <th scope="row" class="text-secondary">Titular:</th>
              <td class="text-end fw-bold" th:text="${ticketConfirmado.fullName}"></td>
            </tr>
            <tr>
              <th scope="row" class="text-secondary">Correo:</th>
              <td class="text-end" th:text="${ticketConfirmado.email}"></td>
            </tr>
            <tr>
              <th scope="row" class="text-secondary">Cantidad de Tickets:</th>
              <td class="text-end fw-bold text-primary fs-5" th:text="${ticketConfirmado.quantity}"></td>
            </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer bg-white text-center p-3">
          <a th:href="@{/tickets/comprar}" class="btn btn-outline-secondary">Volver al inicio</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
